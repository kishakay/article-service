spring:
  application:
    name: article-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/articles}
    username: ${DB_USERNAME:articles}
    password: ${DB_PASSWORD:articles}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
